[project]
name = "solucortex-mcp"
version = "1.1.2"
description = "Official MCP server for SoluCortex — living technical memory for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SoluAI SpA" }]
keywords = ["mcp", "solucortex", "memory", "ai-agents", "model-context-protocol"]
dependencies = [
    "mcp[cli]>=1.10,<2",
    "httpx>=0.27",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://solucortex.ai"
Documentation = "https://solucortex.ai/docs/mcp"
Repository = "https://github.com/soluai-spa/solucortex-mcp"
Issues = "https://github.com/soluai-spa/solucortex-mcp/issues"

[project.scripts]
solucortex-mcp = "solucortex_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solucortex_mcp"]
