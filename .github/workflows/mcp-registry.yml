name: Publish to MCP Registry

# Authenticates as this repo via GitHub Actions OIDC — grants the io.github.soluai-spa
# namespace without depending on user org-membership checks (registry issue #1537).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/mcp-registry.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - name: Wait for PyPI to have this version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          echo "Waiting for solucortex-mcp==$VERSION on PyPI..."
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/solucortex-mcp/$VERSION/json" >/dev/null; then
              echo "PyPI has $VERSION"; exit 0
            fi
            sleep 20
          done
          echo "PyPI never got $VERSION (10 min)"; exit 1
      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc
      - name: Publish
        run: mcp-publisher publish

