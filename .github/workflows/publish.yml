name: Publish to PyPI

# Trusted Publishing (OIDC): no tokens stored anywhere. Requires the PyPI project
# "solucortex-mcp" to have this repo+workflow configured as a trusted publisher.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  test:
    # Gate: nothing is published unless the full suite passes on this exact commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
